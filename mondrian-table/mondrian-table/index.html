<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <link rel="stylesheet" href="style.css">
    <title>Mondrian</title>
</head>
<body>
    <h1> Мондріана</h1>

    <table class="mondrian">
        <colgroup>
            <col class="col-1">
            <col class="col-2">
            <col class="col-3">
            <col class="col-4">
            <col class="col-5">
            <col class="col-6">
            <col class="col-7">
            <col class="col-8">
        </colgroup>

        <tr class="row-1">
            <td colspan="2"></td>
            <td colspan="3"></td>
            <td colspan="2" class="yellow"></td>
            <td></td>
        </tr>

        <tr class="row-2">
            <td rowspan="2"></td>
            <td rowspan="3" colspan="4" class="red"></td>
            <td colspan="2" class="yellow"></td>
            <td rowspan="5"></td>
        </tr>

        <tr class="row-3">
            <td colspan="2" class="yellow"></td>
        </tr>

        <tr class="row-4">
            <td rowspan="2"></td>
            <td rowspan="2"></td>
            <td rowspan="2"></td>
        </tr>

        <tr class="row-5">
            <td rowspan="2" colspan="2" class="black"></td>
            <td colspan="2"></td>
        </tr>

        <tr class="row-6">
            <td rowspan="2" class="yellow"></td>
            <td colspan="2"></td>
            <td rowspan="2" colspan="2" class="blue"></td>
            <td rowspan="2" class="red"></td>
        </tr>

        <tr class="row-7">
            <td colspan="2"></td>
            <td colspan="2" class="black"></td>
        </tr>

        <tr class="row-8">
            <td colspan="3"></td>
            <td colspan="4"></td>
            <td class="red"></td>
        </tr>
    </table>
</body>
</html>
